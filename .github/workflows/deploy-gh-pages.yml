name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  # Lets you re-deploy from the Actions tab without pushing a commit.
  workflow_dispatch:

# Allow one deploy at a time; don't cancel a run that is mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `postinstall` runs `prisma generate`, which only reads the schema file --
      # it does not need a reachable database.
      - run: npm ci

      - name: Build static site
        env:
          # Served from https://<user>.github.io/<repo>, so every asset and link
          # needs the repo name as a prefix. For a <user>.github.io root repo or a
          # custom domain, set this to an empty string instead.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build-gh-pages

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
